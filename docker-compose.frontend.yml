services:
  grillpad-frontend:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-local}
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-https://192.168.1.31/api}
      NUXT_PUBLIC_APP_VERSION: ${APP_VERSION:-local}
    ports:
      - "3000:3000"
    restart: unless-stopped
